<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; connect-src 'self' https://formsubmit.co; form-action https://formsubmit.co; base-uri 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<script>if (window.top !== window.self) { window.top.location.replace(window.location.href); }</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | Job Pulse</title>
<link rel="canonical" href="https://joinjobpulse.com/contact.html">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="description" content="Questions about Job Pulse? Message the Job Pulse team and we'll get back to you fast.">
<link rel="stylesheet" href="style.css?v=6">
</head>
<body>
<main class="wrap">
  <div class="top">
    <a class="logo" href="./"><i><svg viewBox="0 0 64 64" fill="none"><path d="M8 34h12l5-14 8 28 7-20 4 6h12" stroke="#22e58a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></i>Job&nbsp;<span>Pulse</span></a>
  </div>
  <section class="hero">
    <h1>Message the <em>Job Pulse team</em></h1>
    <p class="lede">Questions, support, cancellations, anything. We reply by email, fast.</p>
  </section>
  <form class="card" id="contact" action="https://formsubmit.co/6220c8f505862814ec5341519eed4090" method="POST" style="margin-top:20px">
    <input type="hidden" name="_subject" id="subj" value="Job Pulse question">
    <input type="hidden" name="_template" value="table">
    <input type="hidden" name="_captcha" value="true">
    <input type="hidden" name="_next" value="https://joinjobpulse.com/contact.html?sent=1">
    <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">
    <div class="field"><label for="name">Name</label><input id="name" name="name" required autocomplete="name"></div>
    <div class="field"><label for="email">Your email</label><input id="email" name="email" type="email" required autocomplete="email"></div>
    <div class="field"><label for="msg">Message</label><textarea id="msg" name="message" required style="min-height:140px"></textarea></div>
    <button class="btn" id="go" type="submit">Send to Job Pulse &rarr;</button>
  </form>
  <div class="card" id="ok" hidden style="margin-top:20px;text-align:center"><h2 style="margin:0 0 6px">Got it.</h2><p class="lede" style="margin:0">The Job Pulse team will email you back soon.</p></div>
  <footer>
    <a href="./">Job Pulse home</a> &middot; <a href="https://www.instagram.com/jobpulseio/">@jobpulseio</a><br><a href="terms.html">Terms</a> &middot; <a href="privacy.html">Privacy</a>
  </footer>
</main>
<script>
  var q = new URLSearchParams(location.search);
  if (q.get('sent')) { document.getElementById('contact').hidden = true; document.getElementById('ok').hidden = false; }
  var topics = {support:'Job Pulse support', terms:'Job Pulse terms', privacy:'Job Pulse privacy', code:'Job Pulse access code', answers:'Re: Job Pulse - my answers', result:'Job Pulse result'};
  var t = topics[q.get('t')]; if (t) document.getElementById('subj').value = t;
  // Prefill from the member dashboard (same-site sessionStorage, never the URL)
  try { var p = sessionStorage.getItem('jp_contact'); if (p) { document.getElementById('msg').value = p; sessionStorage.removeItem('jp_contact'); } } catch (e) {}
  document.getElementById('contact').addEventListener('submit', function () { var b = document.getElementById('go'); b.disabled = true; b.textContent = 'Sending…'; });
</script>
</body>
</html>
